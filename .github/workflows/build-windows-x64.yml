# IfcOpenShell C++ Windows x64 MSVC Build
# Builds IfcOpenShell C++ libraries using vcpkg for dependency management.
# Produces headers + libs as a downloadable artifact.

name: Build IfcOpenShell C++ (Windows x64 MSVC)

on:
  push:
    branches: ["v0.8.0"]
  pull_request:
    branches: ["v0.8.0"]
  workflow_dispatch: # Manual trigger

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows
  # Pin a vcpkg commit for reproducible builds
  VCPKG_COMMIT: "01f602195983451bc83e72f4214af2cbc495aa94" # 2024.05.24

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240 # Full boost + OCCT build can be very slow first time

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout IfcOpenShell with submodules
      # ─────────────────────────────────────────────
      - name: Checkout IfcOpenShell
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─────────────────────────────────────────────
      # 2. Setup MSVC environment
      # ─────────────────────────────────────────────
      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ─────────────────────────────────────────────
      # 3. Cache vcpkg packages (saves ~1hr on rebuilds)
      # ─────────────────────────────────────────────
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-win-x64-${{ hashFiles('**/build-windows-x64.yml') }}-v9

      # ─────────────────────────────────────────────
      # 4. Install dependencies via vcpkg
      #    Core: opencascade, boost, eigen3, cgal
      #    Optional: hdf5, libxml2, nlohmann-json
      # ─────────────────────────────────────────────
      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          # vcpkg is pre-installed on windows-2022 runners at C:\vcpkg
          & C:\vcpkg\vcpkg.exe integrate install

          # If cache restored but files are missing, wipe and start fresh
          $testFile = "C:\vcpkg\installed\x64-windows\include\opencascade\Standard_Version.hxx"
          if ((Test-Path "C:\vcpkg\installed\x64-windows") -and !(Test-Path $testFile)) {
            Write-Host "Cache is stale — OCCT headers missing. Removing installed dir."
            Remove-Item -Recurse -Force "C:\vcpkg\installed"
          }

          # Install IfcOpenShell dependencies
          # opencascade = OCCT geometry kernel (the big one)
          # boost = ALL of boost (scope-exit, logic, dynamic-bitset, etc. are all needed)
          # eigen3 = matrix/linear algebra
          # cgal = computational geometry
          # nlohmann-json = JSON support
          # libxml2 = XML parsing for IFCXML
          # hdf5[cpp] = HDF5 with C++ bindings (H5Cpp.h) — must enable [cpp] feature!
          & C:\vcpkg\vcpkg.exe install `
            opencascade:x64-windows `
            boost:x64-windows `
            eigen3:x64-windows `
            cgal:x64-windows `
            nlohmann-json:x64-windows `
            libxml2:x64-windows `
            "hdf5[cpp]:x64-windows"

          # Verify critical files exist
          $missingFiles = @()
          if (!(Test-Path $testFile)) { $missingFiles += "OCCT: Standard_Version.hxx" }
          if (!(Test-Path "C:\vcpkg\installed\x64-windows\include\boost\scope_exit.hpp")) { $missingFiles += "Boost: scope_exit.hpp" }
          if (!(Test-Path "C:\vcpkg\installed\x64-windows\include\H5Cpp.h")) { $missingFiles += "HDF5: H5Cpp.h" }

          if ($missingFiles.Count -gt 0) {
            Write-Error "Missing headers after vcpkg install: $($missingFiles -join ', ')"
            exit 1
          }
          Write-Host "Verification passed — all critical headers present."

          # vcpkg shared libs use names like hdf5.lib, zlib.lib
          # IfcOpenShell expects static-style names: libhdf5.lib, libzlib.lib
          # Create copies with the expected names for all potential mismatches
          $libDir = "C:\vcpkg\installed\x64-windows\lib"

          # Standard lib prefix aliases
          @("hdf5", "hdf5_cpp", "zlib", "szip", "lzma", "iconv", "charset", "xml2", "aec") | ForEach-Object {
            $src = "$libDir\$_.lib"
            $dst = "$libDir\lib$_.lib"
            if ((Test-Path $src) -and !(Test-Path $dst)) {
                Copy-Item $src $dst
                Write-Host "Created alias: lib$_.lib -> $_.lib"
              }
            }

            # HDF5 szip compatibility (libaec replaces sz)
            $src = "$libDir\aec.lib"
            $dst = "$libDir\libsz.lib"
            if ((Test-Path $src) -and !(Test-Path $dst)) {
              Copy-Item $src $dst
              Write-Host "Created alias: libsz.lib -> aec.lib"
            }
          & C:\vcpkg\vcpkg.exe list

      # ─────────────────────────────────────────────
      # 5. Configure CMake
      #    - CMakeLists.txt lives in cmake/ subdirectory
      #    - Disable Python/SWIG (C++ only build)
      #    - Disable Collada (avoids OpenCOLLADA dep)
      #    - Point to vcpkg-installed paths
      # ─────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkgRoot = "C:/vcpkg/installed/x64-windows"
          $occInclude = "$vcpkgRoot/include/opencascade"
          $vcpkgInclude = "$vcpkgRoot/include"

          # IfcOpenShell's CMake doesn't propagate include dirs to all
          # targets consistently. Inject the vcpkg root + OCCT includes
          # globally so every target (IfcGeom, kernels, etc.) finds them.
          $globalIncludes = "$occInclude;$vcpkgInclude"

          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES="$globalIncludes" `
            -DCMAKE_C_STANDARD_INCLUDE_DIRECTORIES="$globalIncludes" `
            -DOCC_INCLUDE_DIR="$occInclude" `
            -DOCC_LIBRARY_DIR="$vcpkgRoot/lib" `
            -DCGAL_INCLUDE_DIR="$vcpkgInclude" `
            -DGMP_INCLUDE_DIR="$vcpkgInclude" `
            -DGMP_LIBRARY_DIR="$vcpkgRoot/lib" `
            -DMPFR_INCLUDE_DIR="$vcpkgInclude" `
            -DMPFR_LIBRARY_DIR="$vcpkgRoot/lib" `
            -DEIGEN_DIR="$vcpkgInclude/eigen3" `
            -DJSON_INCLUDE_DIR="$vcpkgInclude" `
            -DHDF5_SUPPORT=ON `
            -DHDF5_INCLUDE_DIR="$vcpkgInclude" `
            -DHDF5_LIBRARY_DIR="$vcpkgRoot/lib" `
            -DLIBXML2_INCLUDE_DIR="$vcpkgInclude/libxml2" `
            -DLIBXML2_LIBRARIES="$vcpkgRoot/lib/libxml2.lib" `
            -DCOLLADA_SUPPORT=OFF `
            -DBUILD_IFCPYTHON=OFF `
            -DBUILD_EXAMPLES=OFF `
            -S "${{ github.workspace }}\cmake"

      # ─────────────────────────────────────────────
      # 6. Build
      # ─────────────────────────────────────────────
      - name: Build IfcOpenShell
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # ─────────────────────────────────────────────
      # 7. Install to a clean directory
      # ─────────────────────────────────────────────
      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }}

      # ─────────────────────────────────────────────
      # 8. Upload build artifacts
      #    Downloads from: Actions tab → workflow run → Artifacts
      # ─────────────────────────────────────────────
      - name: Upload IfcOpenShell build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ifcopenshell-cpp-win-x64-msvc
          path: ${{ github.workspace }}\install\
          retention-days: 30

      # ─────────────────────────────────────────────
      # 9. (Optional) Also upload the raw build dir
      #    for debugging failed builds
      # ─────────────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-win-x64
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
